# Manual optional pipeline. Requires application Dockerfile at repository root.
# This workflow only pushes the image; it never applies Terraform.
name: Build and push ECR image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable image tag (e.g. commit SHA or release version)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ECR_ROLE_ARN }}
          aws-region: eu-west-3
      - name: Login to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.tag }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          test -f Dockerfile || { echo "A Dockerfile is required at repository root"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Set GitHub variable ECR_REPOSITORY"; exit 1; }
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Pushed $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
